<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastLane | Confidently Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="root"></div>
<noscript>FastLane needs JavaScript turned on.</noscript>
<!-- Plain scripts, loaded in this order (later files use things defined in earlier ones). No build step. -->
<script src="js/config.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/store.js"></script>
<script src="js/store-local.js"></script>
<script src="js/store-supabase.js"></script>
<script src="js/rules.js"></script>
<script src="js/auth.js"></script>
<script src="js/views/layout.js"></script>
<script src="js/views/password.js"></script>
<script src="js/views/quote.js"></script>
<script src="js/views/applications.js"></script>
<script src="js/views/payment.js"></script>
<script src="js/views/underwriting.js"></script>
<script src="js/views/claims.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/policy.js"></script>
<script src="js/main.js"></script>
<script>
/* If a script file is missing (for example the js folder was not uploaded), say so instead of showing a blank page */
try { VIEWS; } catch (e) {
  document.getElementById('root').innerHTML = '<div style="font-family:sans-serif;max-width:580px;margin:3rem auto;padding:1rem"><h2>FastLane could not load</h2><p>One or more script files were not found. Check that the <b>js</b> and <b>css</b> folders are in the repository next to index.html, with the same names and subfolders (js/views/...). Names are case sensitive.</p><p style="color:#666;font-size:.9em">Technical detail: ' + e.message + '</p></div>';
}
</script>
</body>
</html>
